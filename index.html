<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boring Works Games – Boring games. Weirdly satisfying.</title>
<meta name="description" content="Five tiny, weirdly satisfying games from Boring Works. No login. Beat your best.">
<meta name="theme-color" content="#0e0e0e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0e0e0e;--fg:#efe9dc;--mut:#8f8b80;--bd:#2a2926;--card:#1a1917;--ac:#a6e22e;--yl:#ffd400;--red:#ff4b3e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#efe9dc;--fg:#111;--mut:#6a665c;--bd:#d6cfbe;--card:#fbf8f0;--red:#d92d27;color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html.play,html.play body{overflow:hidden;height:100dvh}
html.play header,html.play footer{display:none}
header,main,footer{max-width:760px;margin:0 auto;padding-left:16px;padding-right:16px;box-sizing:border-box}
header{display:flex;align-items:center;gap:6px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;margin-right:auto;color:inherit;text-decoration:none;text-transform:lowercase}
.lg{position:relative;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--fg);background:#000;color:#efe9dc;font-weight:900}
.lg i{position:absolute;right:5px;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.nb{background:none;border:1px solid transparent;border-radius:10px;padding:8px;color:var(--mut);text-decoration:none;font:inherit;font-size:14px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.nb:hover{color:var(--fg);border-color:var(--bd)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.btn{background:var(--ac);color:#111;border:0;border-radius:12px;padding:12px 20px;font-weight:900;min-height:48px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.s{background:var(--card);color:var(--fg);border:1px solid var(--bd);font-weight:700}
.btn.pl{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.ti{font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-.01em}
h1{font-size:clamp(34px,10vw,56px);line-height:1;margin:22px 0 10px}
.mut{color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:20px 0}
.tile{display:block;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.tile:hover{border-color:var(--ac);transform:translateY(-2px)}
.tile i{font-style:normal;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--ac);color:#111;font-weight:900;margin-bottom:8px}
.tile b{display:block;font-size:18px}
.chip{display:inline-block;border:1px solid var(--bd);border-radius:999px;padding:4px 10px;margin:0 6px 6px 0;font-size:14px}
.chip.on{background:var(--ac);color:#111;border-color:var(--ac)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 0 0}
.bar b{margin-right:auto}.bar #sc{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.cb{color:var(--yl);font-weight:900;font-style:italic;font-size:22px}
.wrap{position:relative;margin-top:6px}
.wrap,.stage{min-height:calc(100dvh - 150px);-webkit-touch-callout:none}
.stage{touch-action:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.wm{text-align:center;font-size:12px;color:var(--mut);letter-spacing:.1em}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,360px,calc((100dvh - 230px)*.75))}
.cell{border:1px solid var(--bd);background:var(--card);border-radius:18px;aspect-ratio:1;font-size:28px;font-weight:900;padding:0;transition:transform .08s}
.cell.g{background:var(--ac);color:#111}.cell.r{background:var(--red);color:#fff}.cell.ok{background:var(--yl);color:#111;transform:scale(.85)}.cell.bad{background:var(--red);color:#fff}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,380px,calc(100dvh - 260px));background:var(--bd);padding:8px;border-radius:14px;box-sizing:border-box}
.t4{aspect-ratio:1;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-weight:900;font-size:clamp(18px,6vw,28px);color:#111;animation:pop .12s}
.t4:empty{animation:none}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
.gb{display:grid;gap:10px;width:min(100%,360px,calc(100dvh - 240px))}
.bt{aspect-ratio:1;border-radius:16px;border:2px solid var(--k);background:var(--card);font-size:20px;font-weight:900;color:var(--k);transition:background .08s,transform .08s}
.bt.on{background:var(--k);color:#111;transform:scale(.93)}.bt.bad{background:var(--red);color:#fff;border-color:var(--red)}
.trk{position:relative;width:min(100%,360px);height:110px;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.zn{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ac) 35%,transparent);border-left:2px solid var(--ac);border-right:2px solid var(--ac)}
.bl{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--fg);box-shadow:0 0 14px var(--fg)}
.tb{height:6px;background:var(--bd);border-radius:3px;width:min(100%,340px)}.tb i{display:block;height:100%;background:var(--ac);width:100%}
.sh{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(100%,340px,calc((100dvh - 250px)*.72))}
.bb{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--fg) 35%,transparent),var(--card) 62%);border:1px solid var(--bd);transition:transform .08s,opacity .1s}
.bb.p{transform:scale(.55);opacity:.25}.bb.gd{border-color:var(--yl);box-shadow:0 0 10px var(--yl)}
.big{font-size:64px;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums}
.ov{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 94%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;border-radius:16px}
.ov[hidden]{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rec{color:#111;background:var(--yl);padding:4px 14px;border-radius:999px;font-weight:900;font-style:italic;animation:pulse .8s infinite}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:9;max-width:90%}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
footer{padding-top:24px;padding-bottom:24px;color:var(--mut);font-size:14px}
@media (max-width:600px){header{gap:2px;padding-top:6px;padding-bottom:6px}.hm{display:none}.tiles{grid-template-columns:1fr 1fr;gap:10px}.tile{padding:12px}.tile .mut{font-size:14px}.tiles .tile:last-child{grid-column:span 2}.big{font-size:56px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><a class="logo" href="#"><span class="lg">B<i></i></span>boring works</a><a class="nb hm" href="#">Games</a><a class="nb" href="#daily">Daily</a><a class="nb" href="#how">How to Play</a><button class="nb" id="th">Theme</button><button class="nb" id="sn">Sound</button></header>
<main id="app"></main>
<footer>Scores are saved only on this device. No accounts, no tracking. “Your Records” are personal, not global rankings. · <a href="https://www.youtube.com/@boring-works" target="_blank" rel="noopener" style="color:inherit">YouTube: @boring-works</a></footer>
<div id="fx"></div><div class="toast" id="ts" hidden></div>
<script>
const CFG={name:'BORING WORKS',url:location.href.split('#')[0],yt:'https://www.youtube.com/@boring-works'};
const $=s=>document.querySelector(s);
let S={};try{S=JSON.parse(localStorage.getItem('boringworks')||'{}')||{}}catch(e){S={}}
['best','games','ach','daily'].forEach(k=>S[k]=S[k]&&typeof S[k]=='object'?S[k]:{});S.played=+S.played||0;
const save=()=>{try{localStorage.setItem('boringworks',JSON.stringify(S))}catch(e){}};
function applyTheme(){const t=S.theme||'dark';document.documentElement.dataset.theme=t;$('#th').textContent=t=='dark'?'Light theme':'Dark theme';$('#sn').textContent=S.mute?'Sound off':'Sound on'}
$('#th').onclick=()=>{S.theme=document.documentElement.dataset.theme=='dark'?'light':'dark';save();applyTheme()};
$('#sn').onclick=()=>{S.mute=!S.mute;save();applyTheme()};
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let AC;function vib(n){if(!S.mute&&navigator.vibrate)try{navigator.vibrate(n)}catch(e){}}
function snd(f=440,d=.08){if(S.mute)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const today=()=>new Date().toISOString().slice(0,10); // daily reset at 00:00 UTC
let tt;function toast(m){const e=$('#ts');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2400)}

/* juice */
function burst(x,y,col,n=10){if(RM)return;const f=$('#fx');for(let i=0;i<n;i++){const d=document.createElement('i'),a=Math.random()*6.28,r=30+Math.random()*70;d.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:7px;height:7px;border-radius:50%;background:${col}`;f.append(d);d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(0)`,opacity:0}],{duration:450+Math.random()*300,easing:'ease-out'}).onfinish=()=>d.remove()}}
function say(t,x,y,col){const f=$('#fx'),d=document.createElement('b');d.textContent=t;d.style.cssText=`position:fixed;left:${x}px;top:${y}px;font:900 italic 28px system-ui;color:${col||'#ffd400'};text-shadow:0 2px 0 #000;white-space:nowrap`;f.append(d);d.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:0},{transform:'translate(-50%,-90%) scale(1.15)',opacity:1,offset:.3},{transform:'translate(-50%,-220%) scale(1)',opacity:0}],{duration:RM?400:900}).onfinish=()=>d.remove()}
function shake(){if(RM)return;const s=$('#st');s&&s.animate([{transform:'translateX(0)'},{transform:'translateX(-9px)'},{transform:'translateX(9px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}],{duration:260})}

/* LENTIL SORT */
function lentil(c){let sc=0,combo=0,dead=0,lives=c.mode=='survival'?3:1,cells=[];
c.st.innerHTML='<div class="g3"></div>';const gr=c.st.firstChild;
const inf=()=>c.info(c.mode=='zen'?'Zen · 60s · no penalties':c.mode=='classic'?'Tap lentils ●  Never pebbles ▲':'Lives '+'♥'.repeat(lives));inf();
const rc=()=>{combo=0;c.cb()};
for(let i=0;i<12;i++){const b=document.createElement('button');b.className='cell';b.setAttribute('aria-label','Empty');gr.append(b);cells.push({b,t:0,k:0});c.on(b,'pointerdown',e=>{e.preventDefault();hit(i)})}
function clr(i){const x=cells[i];clearTimeout(x.t);x.k=0;x.b.className='cell';x.b.textContent='';x.b.setAttribute('aria-label','Empty')}
function hit(i){const x=cells[i];if(!c.live||dead||!x.k)return;clearTimeout(x.t);
if(x.k==1){combo++;sc+=1+Math.floor(combo/10);c.score(sc);c.hit(combo,x.b);x.k=0;x.b.className='cell ok';x.b.textContent='✓';c.after(()=>{if(!x.k){x.b.className='cell';x.b.textContent=''}},160)}
else if(c.mode=='zen'){rc();sc=Math.max(0,sc-1);c.score(sc);snd(150,.1);shake();clr(i)}
else{dead=1;x.b.className='cell bad';x.b.textContent='▲';snd(110,.3);vib(90);shake();c.after(()=>c.end(sc),450)}}
function miss(i){clr(i);if(c.mode=='zen')return;rc();lives--;inf();snd(150,.1);if(lives<=0){dead=1;shake();c.after(()=>c.end(sc),350)}}
function spawn(){if(dead)return;const free=cells.map((x,i)=>x.k?-1:i).filter(i=>i>=0);
if(free.length){const i=free[Math.floor(c.rnd()*free.length)],x=cells[i],isR=sc>=2&&c.rnd()<.28;
x.k=isR?2:1;x.b.className='cell '+(isR?'r':'g');x.b.textContent=isR?'▲':'●';x.b.setAttribute('aria-label',isR?'Pebble, do not tap':'Lentil, tap');
x.t=c.after(()=>{if(x.k==1)miss(i);else if(x.k)clr(i)},c.mode=='zen'?1400:Math.max(500,1400-sc*28))}
c.after(spawn,c.mode=='zen'?700:Math.max(260,850-sc*17))}
if(c.mode=='zen')c.after(()=>c.end(sc),60000);
c.score(0);spawn()}

/* SOAP MERGE */
function soap(c){let g=Array(16).fill(0),sc=0,combo=0,prev=null,used=false;
c.st.innerHTML='<div class="g4" id="g4"></div><button class="btn s" id="un">Undo last move (1 per round)</button>';const el=$('#g4');
function add(){const e=g.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)g[e[Math.floor(c.rnd()*e.length)]]=c.rnd()<.9?2:4}
function draw(){el.innerHTML=g.map(v=>`<div class="t4"${v?` style="background:color-mix(in srgb,#ff6fa0 ${Math.min(100,Math.log2(v)*10)}%,#f6e4dc)"`:''}>${v||''}</div>`).join('');c.info('Highest block '+Math.max(...g)+' · Swipe or arrow keys')}
function over(){if(g.includes(0))return false;for(let i=0;i<16;i++){if(i%4<3&&g[i]==g[i+1])return false;if(i<12&&g[i]==g[i+4])return false}return true}
function mv(d){if(!c.live)return;const old=g.slice(),os=sc;let moved=false,mg=0;
for(let i=0;i<4;i++){const ix=[0,1,2,3].map(j=>d==0?i*4+j:d==1?i*4+3-j:d==2?j*4+i:(3-j)*4+i);
const r=ix.map(k=>g[k]).filter(Boolean),o=[];for(let j=0;j<r.length;j++){if(r[j]==r[j+1]){o.push(r[j]*2);sc+=r[j]*2;mg++;j++}else o.push(r[j])}
while(o.length<4)o.push(0);ix.forEach((k,j)=>{if(g[k]!=o[j])moved=true;g[k]=o[j]})}
if(!moved)return;prev={g:old,sc:os};add();c.score(sc);draw();
if(mg){combo++;c.hit(combo,el,'#ff6fa0')}else{combo=0;c.cb();snd(240,.04)}
if(over())c.after(()=>c.end(sc),500)}
$('#un').onclick=()=>{if(!c.live||!prev||used)return;g=prev.g;sc=prev.sc;prev=null;used=true;c.score(sc);draw()};
c.on(document,'keydown',e=>{const d=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.key);if(d>=0){e.preventDefault();mv(d)}});
let sx,sy;c.on(c.st,'pointerdown',e=>{sx=e.clientX;sy=e.clientY});
c.on(c.st,'pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;mv(Math.abs(dx)>Math.abs(dy)?(dx<0?0:1):(dy<0?2:3))});
add();add();c.score(0);draw()}

/* CLICK CLACK */
const K=['#ff4b3e','#ff8a00','#ffd400','#38d13f','#2f7bff','#f2f2f2','#c04bff','#00d1c1','#ff5ca8'];
function click(c){const cfg={easy:[4,650,2],normal:[6,450,3],hard:[9,300,3]}[c.mode],n=cfg[0];
c.st.innerHTML=`<div class="gb" style="grid-template-columns:repeat(${cfg[2]},1fr)">`+Array.from({length:n},(_,i)=>`<button class="bt" style="--k:${K[i]}" aria-label="Tile ${i+1}">${i+1}</button>`).join('')+'</div>';
const bs=[...c.st.querySelectorAll('.bt')];let seq=[],pos=0,lock=true,combo=0;
const fl=(i,ms)=>{bs[i].classList.add('on');snd(260+i*55,ms/1000);vib(8);c.after(()=>bs[i].classList.remove('on'),ms)};
function round(){seq.push(Math.floor(c.rnd()*n));pos=0;lock=true;c.info('Level '+seq.length+' · watch');
seq.forEach((s,k)=>c.after(()=>fl(s,cfg[1]*.7),600+k*cfg[1]));c.after(()=>{lock=false;c.info('Level '+seq.length+' · your turn')},600+seq.length*cfg[1])}
bs.forEach((b,i)=>c.on(b,'pointerdown',e=>{e.preventDefault();if(lock||!c.live)return;
if(i!=seq[pos]){lock=true;b.classList.add('bad');snd(110,.3);vib(90);shake();c.after(()=>c.end(seq.length-1),600)}
else{b.classList.add('on');c.after(()=>b.classList.remove('on'),140);c.hit(++combo,b,K[i]);
if(++pos==seq.length){lock=true;c.score(seq.length);const r=b.getBoundingClientRect();say('LEVEL '+seq.length,r.left+r.width/2,r.top,'#a6e22e');c.after(round,800)}}}));
c.score(0);round()}

/* PERFECT CUT */
function cut(c){let sc=0,combo=0,lives=3,lv=0,dead=0,zc=50,zw=24,ph=0,raf=0,last=performance.now();
c.st.innerHTML='<div class="mut" style="text-align:center">Tap when the blade is inside the green zone</div><div class="trk" id="trk"><div class="zn" id="zn"></div><div class="bl" id="bl"></div></div><div class="mut">Tap anywhere · Space · Enter</div>';
const zn=$('#zn'),bl=$('#bl'),trk=$('#trk'),pos=()=>ph<=1?ph:2-ph;
function newZ(){zw=Math.max(7,(c.mode=='hard'?16:24)-lv*.7);zc=zw/2+8+c.rnd()*(84-zw);zn.style.left=(zc-zw/2)+'%';zn.style.width=zw+'%'}
function tick(now){const dt=(now-last)/1000;last=now;ph=(ph+dt*Math.min(2.4,.9+lv*.04+(c.mode=='hard'?.3:0)))%2;bl.style.left=pos()*100+'%';raf=requestAnimationFrame(tick)}
c.cl.push(()=>cancelAnimationFrame(raf));
function tap(){if(!c.live||dead)return;const p=pos()*100,err=Math.abs(p-zc),r=trk.getBoundingClientRect(),x=r.left+r.width*p/100,y=r.top+r.height/2;
if(err<=zw/2){const pf=err<=zw*.15;combo++;lv++;sc+=1+(pf?2:0)+Math.floor(combo/5);c.score(sc);c.hit(combo,bl,pf?'#ffd400':'#a6e22e');if(pf)say('PERFECT',x,y-50);newZ()}
else{combo=0;c.cb();lives--;shake();snd(120,.25);vib(90);c.info('Lives '+'♥'.repeat(Math.max(0,lives)));if(lives<=0){dead=1;c.after(()=>c.end(sc),500)}}}
c.on(c.st,'pointerdown',e=>{e.preventDefault();tap()});
c.on(document,'keydown',e=>{if((e.key==' '||e.key=='Enter')&&!e.repeat){e.preventDefault();tap()}});
newZ();c.info('Lives ♥♥♥');c.score(0);raf=requestAnimationFrame(t=>{last=t;tick(t)})}

/* POP SHEET */
function pop(c){let sc=0,sheet=0,combo=0,lastp=0,left=0,T=20,tl=20,dead=0;
c.st.innerHTML='<div class="tb"><i id="tb"></i></div><div class="sh" id="sh"></div>';const sh=$('#sh');
function mk(){sheet++;sh.innerHTML='';const gd=new Set();while(gd.size<3)gd.add(Math.floor(c.rnd()*35));
for(let i=0;i<35;i++){const b=document.createElement('div');b.className='bb'+(gd.has(i)?' gd':'');b.dataset.g=gd.has(i)?1:'';sh.append(b)}
left=35;T=Math.max(8,20-sheet);tl=T;c.info('Sheet '+sheet+' · drag across the bubbles')}
function pp(el){if(dead||!c.live||!el||!el.classList||!el.classList.contains('bb')||el.classList.contains('p'))return;
el.classList.add('p');const now=performance.now(),g=el.dataset.g;combo=now-lastp<600?combo+1:1;lastp=now;left--;
sc+=g?5:1;if(g)tl=Math.min(T+2,tl+1);c.score(sc);c.hit(combo,el,g?'#ffd400':'#efe9dc');
if(!left){const b=Math.floor(tl);sc+=b;c.score(sc);say('SHEET CLEAR +'+b,innerWidth/2,innerHeight/2,'#a6e22e');snd(880,.2);vib([30,30,60]);mk()}}
const at=e=>pp(document.elementFromPoint(e.clientX,e.clientY));
c.on(c.st,'pointerdown',e=>{e.preventDefault();at(e)});c.on(c.st,'pointermove',e=>{if(e.buttons||e.pointerType=='touch')at(e)});
c.every(()=>{tl-=.1;const e=$('#tb');if(e)e.style.width=Math.min(100,Math.max(0,tl/T*100))+'%';if(tl<=0&&!dead){dead=1;shake();c.end(sc)}},100);
c.score(0);mk()}

const G=[
{id:'lentil',n:'LENTIL SORT',ic:'●',d:'Tap the lentils. Dodge the pebbles.',m:['classic','survival','zen'],run:lentil},
{id:'soap',n:'SOAP MERGE',ic:'▦',d:'Swipe to merge soft pink blocks.',run:soap},
{id:'click',n:'CLICK CLACK',ic:'◼',d:'Watch the cube clicks. Repeat them.',m:['easy','normal','hard'],run:click},
{id:'cut',n:'PERFECT CUT',ic:'✂',d:'Cut inside the zone. Land perfects.',m:['normal','hard'],run:cut},
{id:'pop',n:'POP SHEET',ic:'○',d:'Drag across bubbles. Beat the clock.',run:pop}];
const dailyG=()=>G[Math.floor(Date.now()/864e5)%5];
const ACH=[['First Run',()=>S.played>=1],['Ten Games Played',()=>S.played>=10],['New Personal Best',()=>S.pb],['Daily Challenger',()=>Object.keys(S.daily).length>0],['Master of All Five',()=>G.every(g=>S.games[g.id])]];
function checkAch(){ACH.forEach(([n,f])=>{if(!S.ach[n]&&f()){S.ach[n]=1;toast('Achievement unlocked: '+n)}})}

let cur=null,CU;
function stopCur(){clearInterval(CU);if(cur){cur.live=false;cur.cl.forEach(f=>f());cur.cl=[];cur=null}}
async function share(g,n,pb){const txt=`I scored ${n} in ${g.n} on ${CFG.name}${pb?' (a new personal best)':''}. Can you beat me?`;
try{if(navigator.share){await navigator.share({text:txt,url:CFG.url});toast('Shared');return}}catch(e){if(e&&e.name=='AbortError')return}
try{await navigator.clipboard.writeText(txt+' '+CFG.url);toast('Copied to clipboard')}catch(e){toast('Couldn’t share or copy. Please copy the score manually.')}}

let ovState='',lastMode,curG,isDaily;
function openGame(g,daily){stopCur();curG=g;isDaily=daily;document.documentElement.classList.add('play');lastMode=g.m?g.m[0]:'';
const best=()=>S.best[g.id]||0;
$('#app').innerHTML=`<div class="bar"><button class="nb" id="bk">← Home</button><b class="ti">${g.n}${daily?' · Daily':''}</b><span id="cb" class="cb"></span><span id="sc">0</span></div><div class="mut" id="inf" style="min-height:22px">Your best: ${best()}</div><div class="wrap"><div class="stage" id="st"></div><div class="ov" id="ov"></div></div><div class="wm">@BORING-WORKS</div>`;
$('#bk').onclick=()=>location.hash='';
const st=$('#st'),ov=$('#ov');
function showStart(){ovState='start';ov.hidden=false;
ov.innerHTML=`<h2 class="ti" style="margin:0;font-size:32px">${g.n}</h2><p class="mut" style="margin:0">${g.d}${daily?' Same challenge for everyone today (UTC).':''}</p><div class="mut">${best()?'Your best: <b style="color:var(--yl)">'+best()+'</b>. Beat it.':'Set your first record.'}</div><div class="row">`+(g.m?g.m.map(m=>`<button class="btn" data-m="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join(''):'<button class="btn pl" data-m="">Play</button>')+'</div><p class="mut" style="margin:0;font-size:14px">Space or Enter to start</p>';
ov.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>begin(b.dataset.m));const f=ov.querySelector('button');f&&f.focus()}
function begin(mode){stopCur();lastMode=mode;ovState='';ov.hidden=true;st.innerHTML='';$('#sc').textContent='0';$('#cb').textContent='';
const c={live:true,cl:[],mode,st,rnd:daily?mul(hash(today()+g.id)):Math.random};
c.after=(f,ms)=>{const id=setTimeout(()=>{if(c.live)f()},ms);c.cl.push(()=>clearTimeout(id));return id};
c.every=(f,ms)=>{const id=setInterval(()=>{if(c.live)f()},ms);c.cl.push(()=>clearInterval(id))};
c.on=(el,ev,fn)=>{el.addEventListener(ev,fn);c.cl.push(()=>el.removeEventListener(ev,fn))};
c.score=n=>{$('#sc').textContent=n};c.info=t=>{$('#inf').textContent=t};c.cb=()=>{$('#cb').textContent=''};
c.hit=(n,el,col='#a6e22e')=>{const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,F=[262,294,330,392,440];
snd(F[n%5]*Math.pow(2,Math.floor(n/5)%3),.07);vib(8);burst(x,y,col,6+Math.min(n,12));$('#cb').textContent=n>1?'×'+n:'';
if(n%10==0||n==5){say(n>=30&&n%10==0?'LEGEND!':n>=20&&n%10==0?'PERFECT!':n==5?'NICE!':'SATISFYING!',x,y-30);vib([20,30,20])}};
c.end=n=>{if(!c.live)return;c.live=false;c.cl.forEach(f=>f());c.cl=[];cur=null;finish(n)};
cur=c;g.run(c)}
function finish(n){const prev=best(),pb=n>prev;S.played++;S.games[g.id]=(S.games[g.id]||0)+1;
if(pb){S.best[g.id]=n;S.pb=1}
if(daily&&!S.daily[today()])S.daily[today()]={id:g.id,score:n};
checkAch();save();ovState='over';ov.hidden=false;
const msg=pb?'':prev>0&&n<prev?`Only ${prev-n} away from your best. One more?`:'Beat your best next run.';
ov.innerHTML=`<div class="mut">Run over</div><div class="big" id="fs">0</div>${pb?'<div class="rec">NEW RECORD</div>':`<div class="mut">${msg}</div>`}<div class="row"><button class="btn" id="pa">Play Again</button><button class="btn s" id="sh">Share Score</button></div><div class="row"><button class="nb" id="hm">Home</button><button class="nb" id="sw">Switch Game</button></div>`;
$('#pa').onclick=()=>begin(lastMode);$('#sh').onclick=()=>share(g,n,pb);$('#hm').onclick=$('#sw').onclick=()=>location.hash='';$('#pa').focus();
let k=0;const stp=Math.max(1,Math.ceil(n/30));clearInterval(CU);CU=setInterval(()=>{const e=$('#fs');if(!e){clearInterval(CU);return}k=Math.min(n,k+stp);e.textContent=k;if(k>=n)clearInterval(CU)},25);
if(pb){snd(660,.2);vib([40,40,80]);const r=ov.getBoundingClientRect();['#a6e22e','#ffd400','#efe9dc','#ff6fa0'].forEach((col,i)=>burst(r.left+r.width*(.2+.2*i),r.top+80,col,24))}
$('#inf').textContent='Your best: '+best()}
showStart();
curG.begin=begin}
document.addEventListener('keydown',e=>{if((e.key==' '||e.key=='Enter')&&!e.repeat&&!cur&&curG&&curG.begin&&(ovState=='over'||(ovState=='start'&&document.activeElement.tagName!='BUTTON'))){e.preventDefault();curG.begin(lastMode||(curG.m?curG.m[0]:''))}});

function home(how){const dg=dailyG(),d=S.daily[today()];
$('#app').innerHTML=`<h1 class="ti">Boring games.<br>Weirdly satisfying.</h1><p class="mut">Five tiny games built for that tingly feeling. Tap, cut, pop, repeat.</p>
<div class="row" style="justify-content:flex-start"><button class="btn" id="rnd">Play a random game</button><a class="btn s" href="#daily">Daily: ${dg.n}${d?' ✓ '+d.score:''}</a></div>
<div class="tiles">${G.map(g=>`<a class="tile" href="#${g.id}"><i>${g.ic}</i><b class="ti">${g.n}</b><span class="mut">${g.d}</span><div class="mut" style="margin-top:8px;font-size:14px">Best: ${S.best[g.id]||'–'}</div></a>`).join('')}</div>
<details${how?' open':''}><summary>How to play</summary><p class="mut">Pick a game and a mode, then play. Tap or click; drag in POP SHEET; swipe or use arrow keys in SOAP MERGE; Space or Enter works in PERFECT CUT and to restart. Chain hits for combos, bigger sounds and effects. Every run ends with a score you can share.</p></details>
<h2>Your Records</h2><p class="mut">Games played: ${S.played}. Saved on this device only.</p>
<div>${ACH.map(([n])=>`<span class="chip${S.ach[n]?' on':''}">${S.ach[n]?'✓':'○'} ${n}</span>`).join('')}</div>`;
$('#rnd').onclick=()=>location.hash=G[Math.floor(Math.random()*5)].id}
function route(){stopCur();curG=null;ovState='';document.documentElement.classList.remove('play');const h=location.hash.slice(1),g=G.find(x=>x.id==h);
if(g)openGame(g,false);else if(h=='daily')openGame(dailyG(),true);else home(h=='how')}
addEventListener('hashchange',route);applyTheme();route();
</script></body></html>
